if('lgin' in d){await doLogin();return}
if('lgout' in d){logout();return}
if('fpo' in d)S.lg.fp=!S.lg.fp;
else if('fps' in d){await fpReq();return}
else if(d.lt){letterPDF(d.lt);return}
else if('reqx' in d)S.reqM=false;
else if(!ME.owner)return;
else if('bell' in d)S.reqM=true;
else if(d.apv||d.rej){const r=ME.reqs.find(x=>x.id===(d.apv||d.rej));if(!r)return;if(d.apv){let ops=[];try{ops=JSON.parse(r.ops)}catch(e){}applyOps(ops);S.alog.unshift({who:r.name+' ('+r.code+')',sum:ops.length+' change(s)',act:'approved',t:Date.now()});save()}else S.alog.unshift({who:r.name+' ('+r.code+')',sum:'request',act:'rejected',t:Date.now()});S.alog=S.alog.slice(0,40);try{await DB.doc('req/'+r.id).delete()}catch(e){}ME.reqs=ME.reqs.filter(x=>x.id!==r.id);save()}
else if(d.pwrst){const u=S.users.find(x=>x.code===d.pwrst);if(!u)return;const pw=((S.rp||{})[d.pwrst]||'').trim()||Math.random().toString(36).slice(2,8).toUpperCase();u.h=await sha(pw);await rec(u.code,pw);S.rpres={code:u.code,pw};try{await DB.doc('pwr/'+NS+'_'+u.code).delete()}catch(e){}ME.pwr=ME.pwr.filter(x=>x.code!==u.code);save()}
else if(d.pwdis){try{await DB.doc('pwr/'+NS+'_'+d.pwdis).delete()}catch(e){}ME.pwr=ME.pwr.filter(x=>x.code!==d.pwdis)}
else if('sigrm' in d){S.co.sig='';save()}
else if('uadd' in d){const N=S.nu;if(!N.code||!N.pw){toast('Employee chunein aur password daalein');return}S.users.push({id:'u'+Date.now().toString(36),code:N.code,perm:{...N.perm},h:await sha(N.pw)});await rec(N.code,N.pw);S.nu={code:'',pw:'',perm:{add:false,data:false,pay:false,ff:false}};save();toast('Staff access add ho gaya')}
else if(d.upset){const v=S.upwv[d.upset];if(!v){toast('Naya password likhein');return}S.users.find(u=>u.code===d.upset).h=await sha(v);await rec(d.upset,v);delete S.upwv[d.upset];save();toast('Password set ho gaya')}
else if(d.uprm){S.users.find(u=>u.code===d.uprm).h='';save();toast('Password hata diya — access band')}
else if(d.udel){S.users=S.users.filter(u=>u.code!==d.udel);save()}
render()},true);
document.addEventListener('input',ev=>{const d=ev.target.dataset,v=ev.target.value;if(d.lg)S.lg[d.lg]=v;else if(d.nu)S.nu[d.nu]=v;else if(d.upw)S.upwv[d.upw]=v;else if(d.rp){S.rp=S.rp||{};S.rp[d.rp]=v}});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.lg!==undefined)doLogin()});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
if(d.lg||d.nu||d.upw||d.rp){if(d.lg)S.lg[d.lg]=t.value;else if(d.nu)S.nu[d.nu]=t.value;else if(d.upw)S.upwv[d.upw]=t.value;else{S.rp=S.rp||{};S.rp[d.rp]=t.value}ev.stopImmediatePropagation();return}
if(d.nup!==undefined){S.nu.perm[d.nup]=t.checked;ev.stopImmediatePropagation();return}
if(d.sig!==undefined){ev.stopImmediatePropagation();if(ME.owner&&t.files[0])sigLoad(t.files[0]);return}
if(d.cp!==undefined){ev.stopImmediatePropagation();if(ME.owner)(async()=>{S.cph=t.value?await sha(t.value):'';save();toast(t.value?'Company password set ho gaya':'Company password hata diya');render()})();return}
if(d.perm&&ME.owner){const[c,k]=d.perm.split('|');const u=S.users.find(x=>x.code===c);u.perm=u.perm||{};u.perm[k]=t.checked;save();ev.stopImmediatePropagation();render();return}
if(d.permall&&ME.owner){const u=S.users.find(x=>x.code===d.permall);u.perm={};AC_KEYS.forEach(k=>u.perm[k]=t.checked);save();ev.stopImmediatePropagation();render()}},true);
if(S.cpw){sha(S.cpw).then(h=>{S.cph=h;S.cpw='';save()})}
S.users.forEach(u=>{if(!u.perm){u.perm={add:u.role==='add',data:u.role==='data',pay:false,ff:u.role==='ff'};u.code=u.code||u.id}});
(async()=>{if(!window.claude){ME.platform=true;await loadReg();if(!ME.chosen){ME.pending=false;render();return}ME.owner=!S.cph&&!S.nopw;try{const ss=sessionStorage.getItem(APP+'_sess');if(ss==='OWNER'&&(S.cph||S.nopw))ME.owner=true;else if(ss&&ss!=='OWNER'){const u=S.users.find(x=>x.code===ss);if(u){ME.user=u;ME.owner=false}}}catch(e){}ME.authed=ME.owner||!!ME.user;ME.pending=false;render();return}
try{const u=await claude.use('user');if(u){ME.platform=!!(await u.isOwner());ME.vid=await u.id()}}catch(e){}
try{const db=await claude.use('db');if(db){DB=db;ME.db=db}}catch(e){}
await loadReg();if(!ME.chosen){ME.pending=false;render();return}
try{if(DB){DBH=DB.doc('app/'+NS);const sn=await DBH.get();if(sn.exists){ME.owner=ME.platform;applyRemote(sn.data())}}}catch(e){}
ME.owner=ME.platform&&!S.cph&&!S.nopw?true:false;
try{const ss=sessionStorage.getItem(APP+'_sess');if(ss==='OWNER'&&(ME.platform||S.cph)){ME.owner=true}else if(ss&&ss!=='OWNER'){const u=S.users.find(x=>x.code===ss);if(u&&u.h){ME.user=u;ME.owner=false}}}catch(e){}
ME.authed=ME.owner||!!ME.user;ME.pending=false;
if(ME.owner){ownerSubs();if(DBH)pushRemote()}else if(ME.user)startStaff();
render();
try{if(DBH)DBH.onSnapshot(x=>{if(x.exists)applyRemote(x.data())},()=>{})}catch(e){}})();
</script></body></html>
